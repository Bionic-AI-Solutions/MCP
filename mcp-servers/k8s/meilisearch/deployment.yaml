apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-meilisearch-config
  namespace: mcp
  labels:
    app: mcp-meilisearch-server
    app.kubernetes.io/name: mcp-meilisearch
data:
  SERVER_NAME: "MeiliSearch Server"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "5"
  PYTHONPATH: "/app/src"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-meilisearch-server
  namespace: mcp
  labels:
    app: mcp-meilisearch-server
    app.kubernetes.io/name: mcp-meilisearch
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-meilisearch-server
  template:
    metadata:
      labels:
        app: mcp-meilisearch-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: meilisearch
          image: docker.io/docker4zerocool/mcp-servers-meilisearch:latest
          imagePullPolicy: Always
          command:
            - fastmcp
            - run
            - src/mcp_servers/meilisearch/server.py
            - --transport
            - http
            - --port
            - "8007"
            - --host
            - "0.0.0.0"
          ports:
            - containerPort: 8007
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mcp-meilisearch-config
          volumeMounts:
            - name: tenant-config
              mountPath: /etc/mcp
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tenant-config
          secret:
            secretName: mcp-meilisearch-tenants
            items:
              - key: tenants.json
                path: tenants.json

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-meilisearch-server
  namespace: mcp
  labels:
    app: mcp-meilisearch-server
    app.kubernetes.io/name: mcp-meilisearch
spec:
  type: ClusterIP
  ports:
    - port: 8007
      targetPort: 8007
      protocol: TCP
      name: http
  selector:
    app: mcp-meilisearch-server
