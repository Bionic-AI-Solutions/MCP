apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-postgres-config
  namespace: mcp
  labels:
    app: mcp-postgres-server
    app.kubernetes.io/name: mcp-postgres
data:
  SERVER_NAME: "Postgres Server"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  PYTHONPATH: "/app/src"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-postgres-server
  namespace: mcp
  labels:
    app: mcp-postgres-server
    app.kubernetes.io/name: mcp-postgres
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-postgres-server
  template:
    metadata:
      labels:
        app: mcp-postgres-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: postgres
          image: docker.io/docker4zerocool/mcp-servers-postgres:latest
          imagePullPolicy: Always
          command:
            - python
            - src/mcp_servers/postgres/server.py
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mcp-postgres-config
          volumeMounts:
            - name: tenant-config
              mountPath: /etc/mcp
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tenant-config
          secret:
            secretName: mcp-postgres-tenants
            items:
              - key: tenants.json
                path: tenants.json

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-postgres-server
  namespace: mcp
  labels:
    app: mcp-postgres-server
    app.kubernetes.io/name: mcp-postgres
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: mcp-postgres-server
